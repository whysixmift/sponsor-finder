<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google SSO Berhasil - Sponsor Finder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center space-y-6 shadow-2xl">
    <div class="w-16 h-16 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-3xl mx-auto border border-emerald-500/20">
      <i class="fa-solid fa-check"></i>
    </div>
    
    <div class="space-y-2">
      <h2 class="text-xl font-bold text-white">Akun Google Berhasil Terhubung!</h2>
      <p class="text-xs text-slate-400">
        Email <span class="text-emerald-400 font-mono font-semibold">{{ email }}</span> kini telah diotorisasi untuk pengiriman proposal sponsorship via Gmail API.
      </p>
    </div>

    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 text-xs text-slate-400">
      Anda dapat menutup tab ini dan kembali ke chat bot Telegram Anda untuk mulai mengirim penawaran sponsorship.
    </div>
  </div>
</body>
</html>
